<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>地球 Online · 角色面板</title>
<style>
  :root {
    --ink: #2b2b2b;
    --dim: #777;
    --line: #e3e0da;
    --red: #c45a4a;
    --blue: #4a6fa5;
    --green: #5a8a5a;
    --gold: #a8862f;
    --bg: #faf9f6;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 390px; margin: 0 auto; padding: 16px 14px 40px; }
  header { text-align: center; padding: 14px 0 4px; position: relative; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; margin: 0; }
  header p { color: var(--dim); font-size: 13px; margin: 6px 0 0; }
  #lang-toggle {
    position: absolute; top: 12px; right: 0;
    font: inherit; font-size: 13px;
    padding: 3px 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  #lang-toggle:hover { border-color: var(--ink); }
  .disclaimer {
    text-align: center; font-size: 11.5px; color: var(--dim);
    background: var(--card); border: 1px dashed var(--line); border-radius: 999px;
    padding: 3px 12px; margin: 10px auto 0; width: fit-content; max-width: 100%;
  }

  /* F2 答题 */
  .progress-wrap { margin: 16px 0 10px; }
  .progress-meta { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .progress-track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #quiz-progress-bar { height: 100%; width: 0; background: var(--red); transition: width .2s; }
  #quiz-q { font-size: 17px; font-weight: 600; margin: 14px 0 12px; }
  #quiz-opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    font: inherit; font-size: 14.5px; text-align: left; line-height: 1.5;
    padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: border-color .12s;
  }
  .opt:hover { border-color: var(--ink); }
  .opt.selected { border-color: var(--red); background: #faf1ee; }
  .quiz-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
  .quiz-nav button {
    font: inherit; font-size: 14px; padding: 6px 16px;
    border: 1px solid var(--line); background: var(--card); border-radius: 6px; cursor: pointer;
  }
  .quiz-nav button:disabled { opacity: .35; cursor: default; }
  #quiz-next:not(:disabled) { border-color: var(--ink); background: var(--ink); color: #fff; }

  /* F3 面板 */
  .panel-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin: 12px 0;
  }
  .panel-head { text-align: center; }
  .panel-head h2 { font-size: 16px; margin: 0 0 2px; letter-spacing: 2px; }
  #panel-seed { font-size: 11.5px; color: var(--dim); font-family: ui-monospace, Menlo, monospace; }
  #panel-class {
    font-size: 19px; font-weight: 700; color: var(--gold);
    margin: 10px 0 2px; letter-spacing: 1px;
  }
  #panel-class2 { font-size: 13px; color: var(--dim); margin: 0 0 4px; }
  .class-desc { font-size: 13px; color: var(--dim); text-align: left; margin: 8px 0 2px; line-height: 1.65; }
  .stat-cmt { font-size: 12px; color: var(--dim); margin: -2px 0 10px; line-height: 1.55; }
  .meta-cmt { font-size: 12.5px; margin: 8px 0; line-height: 1.6; }
  .meta-cmt b { font-size: 12px; color: var(--dim); font-weight: 600; }
  .meta-cmt.top b { color: var(--green); }
  .meta-cmt.low b { color: var(--red); }
  h3.sec { font-size: 13px; color: var(--dim); margin: 14px 0 8px; letter-spacing: 1px; font-weight: 600; }
  .stat { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .stat-label { flex: 0 0 52px; font-size: 13px; }
  .stat-bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .stat-fill { height: 100%; background: var(--blue); border-radius: 4px; }
  .stat-val { flex: 0 0 28px; text-align: right; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  canvas#radar { width: 100%; height: 300px; display: block; }
  details { border-bottom: 1px dashed var(--line); padding: 5px 0; }
  details:last-child { border-bottom: none; }
  summary { font-size: 13.5px; cursor: pointer; list-style-position: inside; }
  summary::marker { color: var(--dim); }
  .note { font-size: 12.5px; color: var(--dim); margin: 4px 0 2px 18px; }
  details.fx-item.buff summary::marker { color: var(--green); }
  details.fx-item.debuff summary::marker { color: var(--red); }
  .flavor {
    font-size: 12.5px; color: var(--dim); font-style: italic;
    border-left: 3px solid var(--gold); padding-left: 12px; margin: 10px 0;
  }
  .hint {
    font-size: 13px;
    border-left: 3px solid var(--blue); padding-left: 12px; margin: 10px 0 4px;
  }
  .hint.side { border-left-color: var(--green); }
  #panel-retake {
    display: block; margin: 16px auto 0;
    font: inherit; font-size: 14px; padding: 6px 18px;
    border: 1px solid var(--line); background: var(--card); border-radius: 6px; cursor: pointer;
  }
  #panel-retake:hover { border-color: var(--ink); }
  footer { text-align: center; color: var(--dim); font-size: 12px; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="lang-toggle" data-i18n="lang.toggle">EN</button>
    <h1 data-i18n="app.title">地球 Online · 角色面板</h1>
    <p data-i18n="app.subtitle">答 12 道题，生成你的游戏风人生角色面板</p>
  </header>
  <p class="disclaimer" data-i18n="app.disclaimer">游戏化自评，非测评</p>

  <!-- F2 答题 -->
  <section id="view-quiz">
    <div class="progress-wrap">
      <div class="progress-meta" id="quiz-progress-num"></div>
      <div class="progress-track"><div id="quiz-progress-bar"></div></div>

    <p id="quiz-q"></p>
    <div id="quiz-opts"></div>
    <div class="quiz-nav">
      <button id="quiz-back" data-i18n="quiz.back">← 上一题</button>
      <button id="quiz-next" data-i18n="quiz.next">下一题 →</button>

  </section>

  <!-- F3/F4 面板 -->
  <section id="view-panel" hidden>
    <div class="panel-card panel-head">
      <h2 data-i18n="panel.title">角色面板</h2>
      <div id="panel-seed"></div>
      <div id="panel-class"></div>
      <div id="panel-class2"></div>
      <p id="panel-class-desc" class="class-desc"></p>
    </div>
    <div class="panel-card">
      <h3 class="sec" data-i18n="panel.attrs">属性</h3>
      <div id="panel-attrs"></div>
    </div>
    <div class="panel-card">
      <h3 class="sec" data-i18n="panel.metas">高玩六维</h3>
      <canvas id="radar"></canvas>
      <div id="panel-meta-cmts"></div>
      <div id="panel-metas"></div>
    </div>
    <div class="panel-card">
      <h3 class="sec" data-i18n="panel.fx">当前状态</h3>
      <div id="panel-fx"></div>
    </div>
    <div class="panel-card">
      <h3 class="sec" data-i18n="panel.flavor">冒险日志</h3>
      <div id="panel-flavor"></div>
      <h3 class="sec" data-i18n="panel.hint">任务提示</h3>
      <p class="hint" id="panel-hint1"></p>
      <p class="hint" id="panel-hint2"></p>
      <p class="hint side" id="panel-side"></p>
    </div>
    <button id="panel-retake" data-i18n="panel.retake">← 重新开号</button>
  </section>

  <footer data-i18n="app.footer">life-mmo · 纯静态单文件 · 无网络请求</footer>
</div>

d":"不仅没恢复，还在持续恶化","q2.t":"新一波技术/行业变化来了，你通常：","q2.a":"第一时间自己研究，比别人先弄懂","q2.b":"听同事朋友聊起才知道","q2.c":"等工作逼到头上才学","q2.d":"完全没注意到变化","q3.t":"你的时间与注意力是怎么安排的？","q3.a":"日历 + 优先级，资源分配明明白白","q3.b":"心里大致有数","q3.c":"随缘，掉哪算哪","q3.d":"时间黑洞常驻，不知不觉一天就没了","q4.t":"面对新机会（新项目/新关系/新可能），你的下注风格是？","q4.a":"多次小尝试——亏得起小的，等得起大的","q4.b":"偶尔试试手气","q4.c":"怕亏，基本不试","q4.d":"全押一把，成则传奇败则删号","q5.t":"在朋友/同事圈里，你是：","q5.a":"先帮忙垫场的那个——组局、牵线、补位","q5.b":"随叫随到的可靠队友","q5.c":"偶尔露面，大部分时间隐身","q5.d":"独行侠，自己刷自己的","q6.t":"长期习惯（运动/学习/创作），你的坚持记录是？","q6.a":"几乎每天都做，像每日签到","q6.b":"每周固定一两次","q6.c":"三分钟热度，开头猛然后断","q6.d":"基本没有能坚持的事","q7.t":"你的睡眠属于哪档？","q7.a":"规律作息，7-8 小时睡饱","q7.b":"大体规律，偶尔超时","q7.c":"工作日欠债，周末狂补","q7.d":"熬夜冠军，凌晨的窗外见太多次","q8.t":"你的运动频率是？","q8.a":"每周 3 次以上","q8.b":"偶尔动一动","q8.c":"健身卡在吃灰（但续费了）","q8.d":"能躺不坐，能坐不站","q9.t":"学新东西（新工具/新领域）时你是？","q9.a":"主动挑最难的啃，越硬越来劲","q9.b":"需要用到了才学","q9.c":"刷短视频碎片化学，收藏了约等于学会了","q9.d":"很久没认真学过新东西了","q10.t":"你的社交能量是？","q10.a":"人越多越精神，组局组上加成","q10.b":"一对一深聊更舒服","q10.c":"能不打字就不打字","q10.d":"独处才充电，社交是耗电","q11.t":"面对诱惑（手机/短视频/拖延），你的抗性是？","q11.a":"直接屏蔽通知，进入勿扰结界","q11.b":"定个番茄钟，偶尔管用","q11.c":"跟诱惑谈判，谈判失败","q11.d":"我不是在抵抗诱惑，我就是诱惑本体","q12.t":"过去一年，你主动尝试新事物（认识新朋友/发布作品/新爱好/新路线）的次数大约是？","q12.a":"十几次以上，抽卡狂魔","q12.b":"几次，有心情才抽","q12.c":"一两次，基本没抽","q12.d":"零次，还在新手村","panel.title":"角色面板","panel.seed":"出生点 RNG","panel.attrs":"属性","panel.metas":"高玩六维","panel.class":"称号","panel.class2":"副称号","panel.fx":"当前状态","panel.flavor":"冒险日志","panel.hint":"任务提示","panel.hint.main":"主线","panel.hint.side":"支线","panel.retake":"← 重新开号","panel.metaTop":"最强维度","panel.metaLow":"最弱维度","attr.health":"健康","attr.spirit":"精神力","attr.int":"智力","attr.charm":"魅力","attr.luck":"运气","attr.will":"意志力","attr.health.hi":"血条厚实：身体这台主机散热良好，长期作战的底仓稳了。","attr.health.mid":"血条中等：不算脆，但也别浪——偶尔的异响是主板在提醒你。","attr.health.lo":"血条偏薄：睡眠与运动就是你的回血技能，先点这两个，再谈输出。","attr.spirit.hi":"能量充沛：情绪电池满格出门，遇事不易掉线。","attr.spirit.mid":"电量中等：日常够用，连轴转时会闪红灯——记得充。","attr.spirit.lo":"电量偏低：你不是懒，是蓝不够。先回蓝（睡眠/休息），再放技能。","attr.int.hi":"头脑锋利：新知识上手快，是队伍里的说明书型选手。","attr.int.mid":"智力稳健：该会的都会，偶尔可以主动啃一块硬骨头加加上限。","attr.int.lo":"经验条久未推进：不是学不动，是入口太无聊——换个你真好奇的题目试试。","attr.charm.hi":"自带光环：站进队伍就生效的增益型选手，人愿意跟你组队。","attr.charm.mid":"魅力平常：熟了很好相处，差的是破冰那一下——可以练。","attr.charm.lo":"组队频道偏静：独狼省了社交消耗，但也吃不到组队经验加成，偶尔开个麦。","attr.luck.hi":"欧气在线：与其说运气好，不如说你抽的卡比别人多。","attr.luck.mid":"运气平平：不好不坏，重点是——你抽卡次数还能再加。","attr.luck.lo":"近期非酋：别转发锦鲤了，运气是次数的函数，先增加尝试次数。","attr.will.hi":"意志如铁：说不开黑就不开黑，自律是你最硬的装备。","attr.will.mid":"意志中等：大方向守得住，小诱惑常常失守——把诱惑挪出视线就好。","attr.will.lo":"意志力常断线：别怪自己，是战术问题——用「环境设计」代替「硬扛」。","meta.metaVersion":"版本理解","meta.minmax":"资源控盘","meta.regen":"回血抗性","meta.rng":"RNG 操纵","meta.guild":"公会运营","meta.grind":"Grinding 纪律","meta.metaVersion.note":"高玩机制：读懂版本（世界的当前规则）比闷头练级值钱——先看懂再用力。","meta.minmax.note":"高玩机制：min-maxing——把有限点数（时间与注意力）集中投给收益最高的方向。","meta.regen.note":"高玩机制：反脆弱——会回血的 build 不怕掉血，挫败恢复速度是隐藏主属性。","meta.rng.note":"高玩机制：运气不可控，但抽卡次数可控——增加尝试 + 不对称下注 = 操纵 RNG。","meta.guild.note":"高玩机制：先做 Buffer——先给队友上增益的人，队伍里永远有位置。","meta.grind.note":"高玩机制：复利——每天 1% 的坚持，一年是 37 倍经验条。","meta.metaVersion.hi":"你对世界规则的变化保持敏感——这是最省力的杠杆：别人用力时，你先看方向。","meta.metaVersion.lo":"你对环境变化的感知偏弱。不着急研究，先养成每月问一次「最近什么变了」的习惯。","meta.minmax.hi":"你懂得把资源押在高收益处——同样的 24 小时，你能挤出更多有效输出。","meta.minmax.lo":"时间与注意力正在被随机任务瓜分。做一次盘点，砍掉收益最低的两项日常。","meta.regen.hi":"你的恢复系统强大——挫败打不倒你，睡一觉又是满状态，这是长期玩家的核心装备。","meta.regen.lo":"挫败后的恢复周期偏长。恢复速度可以练：睡眠、运动、倾诉，是三个最便宜的回血道具。","meta.rng.hi":"你懂得用次数和下注结构制造好运——你不是运气好，你是系统性地更常出现在好运的路上。","meta.rng.lo":"你很少主动「抽卡」。运气是次数的函数：把想要的东西拆成十次小尝试，概率就站在你这边。","meta.guild.hi":"你是队伍里的增益来源——你让别人变强，于是队伍离不开你。","meta.guild.lo":"你偏独狼。独狼没错，但组队有经验加成：本周试着为一位朋友「垫一次场」。","meta.grind.hi":"你握有复利这件重武器——每天一点点的坚持，正在别人看不见的地方滚雪球。","meta.grind.lo":"长期坚持的经验条久未推进。把目标砍到「小到不可能失败」，先连上七天再说。","title.metaReader":"版本解读者","title.metaReader.desc":"你擅长读懂世界正在怎么变——新趋势、新规则，你总比大部队早半步。强在方向感，坑在容易「懂了很多却没下场练」。忠告：看懂三成就该出手了，剩下七成在实战里补。","title.minMaxer":"资源控盘大师","title.minMaxer.desc":"你把时间与注意力当真金白银来分配，同样的日子你能过出双倍产出。强在效率，坑在容易把日子过成排期表，忘了留白也是资源。忠告：给「无用的快乐」留个固定档期。","title.thornsTank":"反伤甲坦克","title.thornsTank.desc":"挫败打不倒你，睡一觉又满状态——你是那种「打不死所以终会赢」的玩家。强在恢复力，坑在依赖抗性硬吃伤害，忽略了闪避（提前避险）。忠告：恢复是底牌，不是日常消费。","title.rngWhisperer":"RNG 驯兽师","title.rngWhisperer.desc":"你明白运气是次数的函数：多抽卡、亏小赚大，让概率站在你这边。强在敢试，坑在试得太散，没有一个方向攒够次数。忠告：给「抽卡」设一个主目标，抽满它。","title.guildSoul":"公会灵魂","title.guildSoul.desc":"你习惯先让别人变强——组局、垫场、补位，队伍因你而成形。强在人缘与号召力，坑在容易把自己的经验条忘了刷。忠告：每周留一块「只为自己升级」的时间。","title.grindMonk":"复利苦行僧","title.grindMonk.desc":"你握着复利这件重武器：每天一点点，别人看不见的地方你在滚雪球。强在续航，坑在容易只顾低头刷，忘了抬头看版本变没变。忠告：每月留一天只复盘不打卡。","title.casualFarmer":"休闲玩家 · 种田流","title.casualFarmer.desc":"你不冲榜、不内卷，在自己的田里按自己的节奏种东西——这其实是被严重低估的玩法。强在稳定与从容，坑在田外的新版本可能与你擦肩。忠告：种田之余，每季度出门探一次图。","title.allRounder":"均衡开拓者","title.allRounder.desc":"你没有明显的短板，各项都在线——这样的面板适配几乎所有玩法。强在全能，坑在缺少一招封喉的长板。忠告：挑一项你最享受的，把它推到「被队友点名要」的深度。","fx.runRegen":"Buff · 被动技能：跑步回血","fx.runRegen.note":"高玩机制：运动是最便宜的持续回血道具，无冷却，不氪金。","fx.fullMana":"Buff · 被动技能：满蓝出门","fx.fullMana.note":"高玩机制：睡眠是回蓝技能——空蓝放不出任何大招。","fx.hawkEye":"Buff · 被动技能：鹰眼","fx.hawkEye.note":"高玩机制：主动啃硬骨头会永久加智力上限，碎片化输入只加疲劳。","fx.auraChar":"Buff · 光环：组队增益","fx.auraChar.note":"高玩机制：光环类技能不需要释放，站在队伍里就生效。","fx.luckCharm":"Buff · 装备：欧气护符","fx.luckCharm.note":"高玩机制：欧气护符的真身是多抽卡——次数本身就是幸运加成。","fx.ironWill":"Buff · 被动技能：铁人纪律","fx.ironWill.note":"高玩机制：纪律不是抗性值，是提前把诱惑移出物品栏。","fx.lowBattery":"Debuff · 低电量 curse","fx.lowBattery.note":"高玩机制：低电量状态下所有技能伤害减半——先回蓝再战斗。","fx.sedentaryDot":"Debuff · 久坐 DoT","fx.sedentaryDot.note":"高玩机制：DoT 伤害小但无视护甲，多年后结算，一次结清。","fx.infoNoise":"Debuff · 信息噪音","fx.infoNoise.note":"高玩机制：收藏夹不进脑子——信息噪音会挤占真正的法力值。","fx.muteChannel":"Debuff · 组队频道静音","fx.muteChannel.note":"高玩机制：独狼省了社交消耗，也吃不到组队经验加成。","fx.unluckyRng":"Debuff · 非酋光环","fx.unluckyRng.note":"高玩机制：非酋的解法不是转发锦鲤，是增加抽卡次数。","fx.cdReset":"Debuff · 三分钟热度 curse","fx.cdReset.note":"高玩机制：技能升到一半弃练，经验条会缓慢清零——复利需要时间。","flavor.flavor1":"本角色为一条命模式（Permadeath）：不可读档，不可转生，请谨慎操作。","flavor.flavor2":"出生点与初始天赋全靠随机——你没抽到的卡，不是你的错。","flavor.flavor3":"服务器已稳定运行 138 亿年，80 亿玩家同时在线，且没有一个 NPC。","flavor.flavor4":"存档点只有当下。系统提示：主线任务由玩家自定义。","flavor.flavor5":"今日天气随机：你遇到的每个人，都在打你看不见的副本。","flavor.flavor6":"检测到玩家凝视星空超过 3 秒——解锁隐藏成就：好奇心。","hint.metaVersion":"主线①：花 30 分钟读一次「版本公告」——你的行业/世界最近更新了什么规则？写下来一条。","hint.minmax":"主线①：给时间与注意力做一次盘点，砍掉收益最低的两项日常，把档期让给最重要的一件事。","hint.regen":"主线①：升级回血技能——本周固定 3 天早睡 + 2 次运动，这是唯二值得优先加点的被动。","hint.rng":"主线①：把你最想要的一个结果拆成十次小尝试（十次投稿/十次邀约/十次迭代），开始抽卡。","hint.guild":"主线①：本周为一位队友「垫一次场」——帮个小忙、组个局、牵条线，公会运营从做 Buffer 开始。","hint.grind":"主线①：挑一件值得复利的事，把目标砍到「小到不可能失败」，先连上七天签到。","hint2.metaVersion":"主线②：找一个你信的人聊 20 分钟「最近什么在变」——二手版本信息也是信息。","hint2.minmax":"主线②：给每周留一段「空白档期」——不排任何任务，留给意外与灵感。","hint2.regen":"主线②：写下最近一次快速恢复的经历，找出你的「回血道具」是什么，常备它。","hint2.rng":"主线②：给每次尝试设一个「亏得起」的上限——不对称下注的关键是活到好运那一次。","hint2.guild":"主线②：把一位很久没联系的老队友加回好友列表，发一句「最近怎么样」。","hint2.grind":"主线②：把进度可视化——日历打叉或表格打点，让经验条看得见，复利才熬得住。","side.health":"支线：本周去探索一条新的步行/骑行路线，把「移动」变成探险而不是任务。","side.spirit":"支线：安排一次彻底的「离线日」——不看消息、不刷动态，纯给自己回蓝。","side.int":"支线：挑一个你纯粹好奇（毫无用处也行）的题目，深挖一个下午。","side.charm":"支线：主动组一次局——一顿饭、一场球、一次散步，你当发起人。","side.luck":"支线：本周做一件「小概率但零成本」的事：投一次稿、要一次机会、认识一个新朋友。","side.will":"支线：今晚睡前把手机放到卧室之外——用环境设计代替意志力硬扛。"},r={"app.title":"Earth Online · Character Sheet","app.subtitle":"Answer 12 questions and roll a game-style character sheet for your life — screenshot it, roast it","app.disclaimer":"Gamified self-check, not an assessment · every stat maps directly to your answers, no black box","app.footer":"life-mmo · static single file · no network requests · permadeath mode","lang.toggle":"中","quiz.progress":"Progress","quiz.back":"← Previous","quiz.next":"Next →","quiz.finish":"Generate Character Sheet","q1.t":"After a setback (failure / rejection / messing up), your recovery looks like…","q1.a":"Full HP after one night's sleep, back out the next day","q1.b":"About a week, slowly regenerating","q1.c":"Months — the recovery bar crawls","q1.d":"Not recovering — still getting worse","q2.t":"A new wave of tech / industry change arrives. You usually…","q2.a":"Dig into it first, understand it before others do","q2.b":"Hear about it from colleagues and friends","q2.c":"Learn it only when work forces me to","q2.d":"Didn't even notice anything changed","q3.t":"How do you organize your time and attention?","q3.a":"Calendar + priorities — every hour allocated on purpose","q3.b":"Rough mental model, mostly works","q3.c":"Drift wherever the day takes me","q3.d":"Permanent time black hole — days vanish without a trace","q4.t":"Facing new opportunities (project / relationship / possibility), your betting style is…","q4.a":"Many small tries — can afford small losses, can wait for big wins","q4.b":"Occasionally try my luck","q4.c":"Too afraid of losses, rarely try","q4.d":"All-in on one pull — legend or delete account","q5.t":"In your circle of friends and colleagues, you are…","q5.a":"The one who sets things up — organizing, connecting, filling gaps","q5.b":"The reliable teammate who always shows up","q5.c":"Occasionally visible, mostly stealthed","q5.d":"A lone wolf grinding my own game","q6.t":"Long-term habits (exercise / learning / creating): your streak record?","q6.a":"Almost daily, like a login streak","q6.b":"Once or twice a week, steady","q6.c":"Three-minute enthusiasm — strong start, then gone","q6.d":"Basically nothing I've kept up","q7.t":"Your sleep tier?","q7.a":"Regular schedule, 7-8 solid hours","q7.b":"Mostly regular, occasional overtime","q7.c":"Borrow on weekdays, repay on weekends","q7.d":"Night-owl champion — seen every 3 a.m. window","q8.t":"Your exercise frequency?","q8.a":"3+ times a week","q8.b":"Occasional movement","q8.c":"Gym card gathering dust (but auto-renewed)","q8.d":"If I can lie, I won't sit; if I can sit, I won't stand","q9.t":"When learning something new, you are…","q9.a":"Hard-mode enjoyer — the tougher, the better","q9.b":"Learn when the quest demands it","q9.c":"Fragmented short-video learning — bookmarked equals learned","q9.d":"Haven't seriously learned anything new in ages","q10.t":"Your social energy?","q10.a":"More people, more energy — party buffs on","q10.b":"One-on-one deep talks are better","q10.c":"If I can avoid typing, I will","q10.d":"Recharge alone — socializing drains the battery","q11.t":"Vs. temptation (phone / feeds / procrastination), your resistance is…","q11.a":"Mute everything, enter the Do-Not-Disturb bubble","q11.b":"Pomodoro, occasionally works","q11.c":"Negotiated with temptation — negotiation failed","q11.d":"I don't resist temptation, I AM the temptation","q12.t":"In the past year, how often did you actively try new things (new people / publishing work / new hobbies / new routes)?","q12.a":"A dozen or more — gacha maniac","q12.b":"A few times, when in the mood","q12.c":"Once or twice, barely pulled","q12.d":"Zero — still in the starter village","panel.title":"Character Sheet","panel.seed":"Spawn RNG","panel.attrs":"Attributes","panel.metas":"The Six Pro Skills","panel.class":"Class","panel.class2":"Secondary Class","panel.fx":"Active Effects","panel.flavor":"Adventure Log","panel.hint":"Quest Hints","panel.hint.main":"Main Quest","panel.hint.side":"Side Quest","panel.retake":"← New Character","panel.metaTop":"Strongest Skill","panel.metaLow":"Weakest Skill","attr.health":"Health","attr.spirit":"Spirit","attr.int":"Intellect","attr.charm":"Charisma","attr.luck":"Luck","attr.will":"Willpower","attr.health.hi":"Thick HP bar: the hardware runs cool and stable — your long-game foundation is solid.","attr.health.mid":"Mid-tier HP: not fragile, but don't tank everything — occasional aches are the motherboard waving at you.","attr.health.lo":"Thin HP bar: sleep and movement are your healing skills — spec into those two before any damage stats.","attr.spirit.hi":"Fully charged: you leave home with a full emotional battery and rarely disconnect under stress.","attr.spirit.mid":"Mid battery: fine for daily quests, blinks red on marathon days — remember to recharge.","attr.spirit.lo":"Low battery: you're not lazy, you're out of mana. Recharge first (sleep, rest), then cast.","attr.int.hi":"Sharp mind: new knowledge sticks fast — you're the party's walking manual.","attr.int.mid":"Solid intellect: you know what you need. Occasionally chew one hard problem to raise the cap.","attr.int.lo":"XP bar stalled: it's not that you can't learn — the entrance is boring. Pick a topic you're genuinely curious about.","attr.charm.hi":"Built-in aura: a buff that works by standing in the party — people want you on their team.","attr.charm.mid":"Average charisma: great once people know you. The missing piece is the first hello — trainable.","attr.charm.lo":"Quiet party channel: the lone wolf saves social cost but forfeits party XP bonuses — unmute occasionally.","attr.luck.hi":"Luck online: less about luck, more that you pull more cards than most.","attr.luck.mid":"Average luck: neither blessed nor cursed — the point is, you could still pull more cards.","attr.luck.lo":"Recent unlucky streak: skip the lucky-charm posts. Luck is a function of attempts — increase the attempts.","attr.will.hi":"Iron will: when you say no raid tonight, there's no raid tonight. Discipline is your hardest gear.","attr.will.mid":"Mid willpower: you hold the big line, small temptations breach often — just move them out of sight.","attr.will.lo":"Willpower keeps disconnecting: not your fault, it's tactics — use environment design instead of brute force.","meta.metaVersion":"Meta Reading","meta.minmax":"Resource Min-Max","meta.regen":"Regen Resistance","meta.rng":"RNG Manipulation","meta.guild":"Guild Ops","meta.grind":"Grinding Discipline","meta.metaVersion.note":"Pro mechanic: reading the meta (the world's current rules) beats mindless grinding — understand first, then push.","meta.minmax.note":"Pro mechanic: min-maxing — concentrate limited points (time and attention) into the highest-ROI direction.","meta.regen.note":"Pro mechanic: antifragile builds don't fear damage — recovery speed is a hidden primary stat.","meta.rng.note":"Pro mechanic: luck is uncontrollable, ticket count is — more attempts + asymmetric bets = manipulating RNG.","meta.guild.note":"Pro mechanic: be the Buffer first — the one who buffs teammates always has a spot in the raid.","meta.grind.note":"Pro mechanic: compounding — 1% daily grinding is a 37x XP bar in a year.","meta.metaVersion.hi":"You stay sensitive to how the world's rules change — the cheapest leverage: while others push harder, you check direction first.","meta.metaVersion.lo":"Your radar for environmental change is quiet. No need to research — just build the habit of asking monthly: 'what changed recently?'","meta.minmax.hi":"You know to stack resources on high-yield spots — same 24 hours, more effective output squeezed out.","meta.minmax.lo":"Your time and attention are being diced by random quests. Audit once, cut the two lowest-ROI dailies.","meta.regen.hi":"Your recovery system is strong — setbacks don't keep you down; a night's sleep restores full state. Core gear for long-term players.","meta.regen.lo":"Post-setback recovery runs long. Recovery speed is trainable: sleep, movement, and talking it out are the three cheapest healing items.","meta.rng.hi":"You manufacture luck with volume and bet structure — you're not lucky, you're systematically more often on luck's path.","meta.rng.lo":"You rarely pull cards. Luck is a function of attempts: split what you want into ten small tries, and probability sides with you.","meta.guild.hi":"You are the party's buff source — you make others stronger, so the party can't do without you.","meta.guild.lo":"You lean lone wolf. Nothing wrong with it — but parties get an XP bonus: this week, set the stage once for a friend.","meta.grind.hi":"You wield compounding, the heavy weapon — a little daily persistence is snowballing where no one watches.","meta.grind.lo":"The long-term-grit XP bar has stalled. Shrink the goal until it's impossible to fail, then chain seven days.","title.metaReader":"Meta Reader","title.metaReader.desc":"You're good at reading how the world is changing — new trends, new rules, half a step ahead of the crowd. Strength: direction sense. Trap: understanding plenty but never queuing up to play. Advice: act at 30% understanding; earn the rest in battle.","title.minMaxer":"Resource Min-Maxer","title.minMaxer.desc":"You treat time and attention as real currency to allocate — same days, double the output. Strength: efficiency. Trap: turning life into a schedule and forgetting that blank space is also a resource. Advice: keep a fixed slot for 'useless joy'.","title.thornsTank":"Thorns Tank","title.thornsTank.desc":"Setbacks can't keep you down — one night's sleep and you're at full state. You're the 'can't be killed, so will eventually win' type. Strength: recovery. Trap: relying on armor to face-tank, skipping dodge (avoiding risk early). Advice: recovery is your trump card, not daily spending.","title.rngWhisperer":"RNG Whisperer","title.rngWhisperer.desc":"You know luck is a function of attempts: pull more cards, lose small, win big — get probability on your side. Strength: willingness to try. Trap: trying too scatter-shot, never enough pulls in one direction. Advice: set one main gacha target and pull until it hits.","title.guildSoul":"Soul of the Guild","title.guildSoul.desc":"You habitually make others stronger first — organizing, connecting, filling gaps; parties form around you. Strength: goodwill and rallying power. Trap: forgetting to farm your own XP bar. Advice: block a weekly slot that upgrades only you.","title.grindMonk":"Monk of Compounding","title.grindMonk.desc":"You wield compounding, the heavy weapon: a little every day, snowballing where nobody watches. Strength: endurance. Trap: head-down grinding while the meta shifts overhead. Advice: one day each month for review only — no check-ins.","title.casualFarmer":"Casual Player · Farm Build","title.casualFarmer.desc":"You don't chase leaderboards or burn out — you grow things at your own pace on your own field, a badly underrated playstyle. Strength: steadiness and calm. Trap: new patches may pass you by. Advice: once a season, leave the farm and scout the map.","title.allRounder":"All-Round Explorer","title.allRounder.desc":"No obvious weak spots — every stat online. Such a sheet fits nearly every playstyle. Strength: versatility. Trap: lacking a kill-shot specialty. Advice: pick the one you enjoy most and push it to 'teammates call for you by name' depth.","fx.runRegen":"Buff · Passive: Run to Heal","fx.runRegen.note":"Pro mechanic: exercise is the cheapest HoT item — no cooldown, no pay-to-win.","fx.fullMana":"Buff · Passive: Full Mana","fx.fullMana.note":"Pro mechanic: sleep is your mana regen — you can't cast ultimates on empty.","fx.hawkEye":"Buff · Passive: Hawkeye","fx.hawkEye.note":"Pro mechanic: chewing hard problems raises your intellect cap permanently; fragmented input only raises fatigue.","fx.auraChar":"Buff · Aura: Party Buff","fx.auraChar.note":"Pro mechanic: auras don't need casting — they work by standing in the party.","fx.luckCharm":"Buff · Gear: Luck Charm","fx.luckCharm.note":"Pro mechanic: the real luck charm is more attempts — volume is itself a luck bonus.","fx.ironWill":"Buff · Passive: Iron Discipline","fx.ironWill.note":"Pro mechanic: discipline isn't a resistance stat — it's removing temptation from your inventory beforehand.","fx.lowBattery":"Debuff · Low Battery Curse","fx.lowBattery.note":"Pro mechanic: at low battery every skill deals half damage — regen mana before fighting.","fx.sedentaryDot":"Debuff · Sedentary DoT","fx.sedentaryDot.note":"Pro mechanic: DoT damage ignores armor, settles years later, all at once.","fx.infoNoise":"Debuff · Info Noise","fx.infoNoise.note":"Pro mechanic: bookmarks don't enter the brain — info noise drains your actual mana pool.","fx.muteChannel":"Debuff · Muted Party Channel","fx.muteChannel.note":"Pro mechanic: the lone wolf saves social cost, but forfeits the party XP bonus.","fx.unluckyRng":"Debuff · Unlucky Aura","fx.unluckyRng.note":"Pro mechanic: the cure for bad luck isn't a lucky charm post — it's more lottery tickets.","fx.cdReset":"Debuff · Three-Minute Curse","fx.cdReset.note":"Pro mechanic: abandon a skill halfway and the XP bar slowly resets — compounding needs time.","flavor.flavor1":"This character runs permadeath mode: no saves, no respawns, no rerolls. Play carefully.","flavor.flavor2":"Spawn point and starting talents are pure RNG — the cards you didn't draw were never your fault.","flavor.flavor3":"Server uptime: 13.8 billion years. 8 billion players online, zero NPCs.","flavor.flavor4":"The only save point is now. System notice: the main quest is player-defined.","flavor.flavor5":"Today's weather: random. Everyone you meet is fighting a dungeon you can't see.","flavor.flavor6":"Player detected staring at the sky for 3+ seconds — hidden achievement unlocked: Curiosity.","hint.metaVersion":"Main ①: spend 30 minutes reading the 'patch notes' — what rules did your industry/world update recently? Write one down.","hint.minmax":"Main ①: audit your time and attention, cut the two lowest-ROI dailies, give the slot to the single most important thing.","hint.regen":"Main ①: level up your regen — 3 early nights + 2 workouts this week. The only two passives worth early points.","hint.rng":"Main ①: split the outcome you want most into ten small attempts (ten submissions / asks / iterations) — start pulling.","hint.guild":"Main ①: set the stage for one teammate this week — a small favor, a gathering, an intro. Guild ops starts with being the Buffer.","hint.grind":"Main ①: pick one compounding habit, shrink it until it's impossible to fail, then chain seven check-ins.","hint2.metaVersion":"Main ②: chat 20 minutes with someone you trust about 'what's changing' — secondhand meta info still counts.","hint2.minmax":"Main ②: keep a weekly blank slot — nothing scheduled, reserved for accidents and inspiration.","hint2.regen":"Main ②: write down your most recent quick recovery and identify your healing item — then keep it stocked.","hint2.rng":"Main ②: set an 'affordable loss' cap per attempt — the key to asymmetric betting is surviving until the lucky pull.","hint2.guild":"Main ②: re-add a long-lost teammate to your friends list, send one line: 'how've you been?'","hint2.grind":"Main ②: visualize the streak — calendar crosses or a dot grid. A visible XP bar is what makes compounding survivable.","side.health":"Side quest: explore a new walking or cycling route this week — turn 'movement' into exploration, not errand.","side.spirit":"Side quest: schedule one fully offline day — no messages, no feeds, pure recharge.","side.int":"Side quest: pick a topic you're purely curious about (uselessness allowed) and dig for one afternoon.","side.charm":"Side quest: organize one gathering yourself — a meal, a game, a walk. You're the initiator.","side.luck":"Side quest: do one small-probability, zero-cost thing this week: submit something, ask for a shot, meet someone new.","side.will":"Side quest: tonight, leave the phone outside the bedroom — environment design over willpower."},Kj={zh:B,en:r},bj={...B},kj={...r},m="zh";function Y(j){return Kj[m][j]??B[j]??j}function s(){return m}function a(){try{let j=new URLSearchParams(window.location.search).get("lang");if(j==="en"||j==="zh")return j}catch{}try{let j=localStorage.getItem("lang");if(j==="en"||j==="zh")return j}catch{}try{if(navigator.language?.toLowerCase().startsWith("zh"))return"zh"}catch{}return"en"}function o(j,Z=!0){if(m=j,Z)try{localStorage.setItem("lang",j)}catch{}if(zj(),typeof window<"u")window.dispatchEvent(new Event("langchange"))}function zj(){if(typeof document>"u")return;document.documentElement.lang=m==="zh"?"zh-CN":"en",document.title=Y("app.title"),document.querySelectorAll("[data-i18n]").forEach((j)=>{j.textContent=Y(j.dataset.i18n)})}function t(j,Z){let q=Math.min(window.devicePixelRatio||1,4),H=j.clientWidth||320,G=j.getContext("2d");G.font="12px 'Songti SC', 'Noto Serif SC', Georgia, serif";let h=Math.max(...Z.map(($)=>G.measureText($.label).width)),M=Math.max(48,H/2-30-h),I=Math.round(M*2+110);j.width=Math.round(H*
